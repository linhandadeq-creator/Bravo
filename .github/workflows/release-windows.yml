name: release-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (standalone)
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          $env:NEXT_PUBLIC_API_URL = ""
          npm run build

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $py = "packaging\windows\build\python"
          New-Item -ItemType Directory -Force -Path $py | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile python.zip
          Expand-Archive python.zip -DestinationPath $py
          $pth = Get-ChildItem $py -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#import site$', 'import site' | Set-Content $pth.FullName
          Add-Content $pth.FullName 'Lib\site-packages'
          New-Item -ItemType Directory -Force -Path "$py\Lib\site-packages" | Out-Null

      - name: Install Python dependencies into bundled runtime
        shell: pwsh
        run: |
          $py = "packaging\windows\build\python"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & "$py\python.exe" get-pip.py --no-warn-script-location
          & "$py\python.exe" -m pip install --no-warn-script-location -r packaging\windows\requirements-win.txt

      - name: Download portable Node
        shell: pwsh
        run: |
          $stage = "$PWD\packaging\windows\portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $version = "v20.18.1"
          $file = "node-$version-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$version/$file" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node_tmp
          Move-Item (Get-ChildItem node_tmp -Directory | Select-Object -First 1).FullName "$stage\node"

      - name: Stage application files
        shell: pwsh
        run: |
          $stage = "$PWD\packaging\windows\portable"
          Move-Item "packaging\windows\build\python" "$stage\runtime"
          New-Item -ItemType Directory -Force -Path "$stage\backend", "$stage\frontend", "$stage\storage" | Out-Null
          Copy-Item backend\app, backend\alembic, backend\scripts, backend\alembic.ini -Destination "$stage\backend" -Recurse -Force
          Copy-Item frontend\.next\standalone\* -Destination "$stage\frontend" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$stage\frontend\.next" | Out-Null
          Copy-Item frontend\.next\static -Destination "$stage\frontend\.next\static" -Recurse -Force
          if (Test-Path frontend\public) {
            Copy-Item frontend\public -Destination "$stage\frontend\public" -Recurse -Force
          }
          Copy-Item packaging\windows\launcher.py, packaging\windows\Stop-Bravo.ps1, LICENSE, README.md -Destination $stage -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $stage = "$PWD\packaging\windows\portable"
          Push-Location packaging\windows
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DSTAGE=$stage" installer.nsi
          Pop-Location
          Get-Item packaging\windows\Bravo-Setup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Bravo-Setup-windows-x64
          path: packaging/windows/Bravo-Setup.exe
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/Bravo-Setup.exe
